<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#081519" />
    <title>Fiji Spatial View</title>
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
    <script src="/cesium/Cesium.js"></script>
  </head>
  <body>
    <main id="globe" aria-label="Interactive 3D map of Fiji"></main>
    <header>
      <span class="compass" aria-hidden="true">✧</span>
      <h1>Fiji Spatial View</h1>
    </header>
    <div class="bottom">
      <output id="status" role="status"></output>
      <nav id="layers" aria-label="Map layers"></nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
